<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f172a" />
  <title>Morel Technology — Sitio en mantenimiento</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: rgba(148, 163, 184, 0.18);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #2563eb;
      --whatsapp: #22c55e;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 36px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      animation: fade-up 0.4s ease-out both;
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin: 0 auto 20px;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.25);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      animation: pulse 1.6s ease-in-out infinite;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .contacts {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .btn:active { transform: translateY(0); }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #fff;
    }

    .btn-instagram {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .footer {
      margin-top: 26px;
      font-size: 12px;
      color: #64748b;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card" id="mt-maintenance">
    <svg class="logo" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect width="64" height="64" rx="16" fill="#2563eb"/>
      <text x="32" y="42" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif">MT</text>
    </svg>

    <div class="badge"><span class="dot"></span> En mantenimiento</div>

    <h1>Estamos de vuelta en un momento</h1>
    <p>Estamos actualizando nuestra tienda para brindarte una mejor experiencia.</p>
    <p>Por favor, reintenta en unos minutos.</p>

    <div class="contacts">
      <a class="btn btn-whatsapp" href="https://wa.me/18096175517" target="_blank" rel="noopener noreferrer">
        Escr&iacute;benos por WhatsApp
      </a>
      <a class="btn btn-instagram" href="https://instagram.com/moreltechnology" target="_blank" rel="noopener noreferrer">
        Instagram
      </a>
    </div>

    <p class="footer">&copy; <span id="year"></span> Morel Technology. Todos los derechos reservados.</p>
  </div>

  <script>
    // A&ntilde;o din&aacute;mico
    document.getElementById("year").textContent = new Date().getFullYear();

    // Auto-reintento: cuando la aplicaci&oacute;n vuelva a responder, recarga al sitio real.
    // La p&aacute;gina de mantenimiento es reconocible por el marcador #mt-maintenance.
    var marker = "mt-maintenance";
    var retrySeconds = 15;

    function checkSite() {
      fetch(window.location.pathname, {
        method: "GET",
        cache: "no-store",
        headers: { "Accept": "text/html" }
      })
        .then(function (res) {
          if (!res.ok && res.status !== 404 && res.status !== 502 && res.status !== 503) {
            window.location.replace("/");
            return;
          }
          return res.text().then(function (text) {
            if (!text || text.indexOf(marker) === -1) {
              window.location.replace("/");
            }
          });
        })
        .catch(function () {
          // A&uacute;n no disponible; se reintenta en el siguiente ciclo.
        });
    }

    setTimeout(checkSite, retrySeconds * 1000);
  </script>
</body>
</html>
